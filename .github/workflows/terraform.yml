name: terraform

on:
  pull_request:
    # The workflow must run on changes to itself, or a workflow-only fix
    # silently produces no run (PR #31 merged with zero CI).
    paths:
      [
        "infra/**",
        "src/**",
        "public/**",
        "package.json",
        "bun.lock",
        "wrangler.toml",
        ".github/workflows/terraform.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "infra/**",
        "src/**",
        "public/**",
        "package.json",
        "bun.lock",
        "wrangler.toml",
        ".github/workflows/terraform.yml",
      ]
  workflow_dispatch:

# One terraform run at a time — applies must never overlap.
concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Terraform matches TF_VAR_ names case-sensitively; the variables are
      # declared lowercase (infra/variables.tf), so the env keys must be too.
      TF_VAR_account_id: ${{ secrets.TF_VAR_ACCOUNT_ID }}
      TF_VAR_inbox_token: ${{ secrets.TF_VAR_INBOX_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install

      # Builds dist/worker.js; terraform reads it via content_file.
      - run: bun run build

      # hashicorp/setup-terraform v3
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.9"

      - run: terraform -chdir=infra init

      - run: terraform -chdir=infra fmt -check

      - run: terraform -chdir=infra validate

      - run: terraform -chdir=infra plan -out=tfplan

      # The v5 provider reports a fresh startup_time_ms after every script
      # update, tripping "Provider produced inconsistent result after apply"
      # (the deploy itself succeeds). The retry's plan refreshes state from
      # the API, finds no changes, and exits 0.
      - run: |
          terraform -chdir=infra apply -auto-approve tfplan \
            || terraform -chdir=infra apply -auto-approve
        if: >
          github.ref == 'refs/heads/main'
          && github.event_name != 'pull_request'
